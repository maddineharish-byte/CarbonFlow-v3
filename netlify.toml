[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Proxy /api/gemini/chat requests directly to the Netlify Serverless Function
[[redirects]]
  from = "/api/gemini/chat"
  to = "/.netlify/functions/gemini-chat"
  status = 200
  force = true

# Proxy all other /api/* requests to the Java Spring Boot backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://carbonflow-v3.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

