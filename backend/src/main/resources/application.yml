server:
  port: ${PORT:${BACKEND_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    whitelabel:
      enabled: false

spring:
  application:
    name: carbonflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/carbonflow;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000 # 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://carbonflow.ai.studio,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.ai.studio,https://*.netlify.app,https://*.onrender.com,https://*.run.app,http://localhost:*,http://127.0.0.1:*}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:auspicious-compass-tcb1c}
  database-id: ${FIRESTORE_DATABASE_ID:ai-studio-carbonflowcarbon-7dfa5a2a-c56a-4dd5-b7d2-6ec22f692f8d}
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  default-model: ${GEMINI_DEFAULT_MODEL:gemini-3.1-flash-lite}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

routing:
  provider: ${ROUTING_PROVIDER:osrm}
  osrm:
    endpoint: ${OSRM_ENDPOINT:https://router.project-osrm.org}
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

maps:
  tile-provider: ${MAP_TILE_PROVIDER:openfreemap}
  openfreemap:
    default-style: https://tiles.openfreemap.org/styles/liberty

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:${VITE_GOOGLE_MAPS_API_KEY:}}
    solution-id: gmp_mcp_codeassist_v1_aistudio
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
