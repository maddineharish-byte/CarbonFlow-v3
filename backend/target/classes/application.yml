server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    whitelabel:
      enabled: false

spring:
  application:
    name: carbonflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/carbonflow;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

jwt:
  secret: ${JWT_SECRET:c2VjdXJlLWNhcmJvbmZsb3ctcHJvZHVjdGlvbi1zZWNyZXQta2V5LTIwMjYtMjU2LWJpdC1taW5pbXVtLXN0cmVuZ3Ro}
  expiration-ms: 86400000 # 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:${VITE_GOOGLE_MAPS_API_KEY:}}
    solution-id: gmp_mcp_codeassist_v1_aistudio
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
